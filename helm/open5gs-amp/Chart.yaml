apiVersion: v2
name: open5gs-amp
description: open5gs metrics pipeline -> Amazon Managed Prometheus (kube-prometheus-stack in agent mode, remote_write via SigV4/IRSA)
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: kube-prometheus-stack
    version: ">=58.0.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-prometheus-stack.enabled
