apiVersion: v1
kind: Namespace
metadata: {name: open5gs}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mongodb, namespace: open5gs}
spec:
  replicas: 1
  selector: {matchLabels: {app: mongodb}}
  template:
    metadata: {labels: {app: mongodb}}
    spec:
      containers:
      - name: mongodb
        image: public.ecr.aws/a7y4t3f5/telco-buddy/mongo:6.0
        ports: [{containerPort: 27017}]
---
apiVersion: v1
kind: Service
metadata: {name: mongodb, namespace: open5gs}
spec: {selector: {app: mongodb}, ports: [{port: 27017, targetPort: 27017}]}
---
apiVersion: v1
kind: Service
metadata: {name: mongo, namespace: open5gs}
spec: {type: ExternalName, externalName: mongodb.open5gs.svc.cluster.local}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nrf, namespace: open5gs, labels: {app: nrf, nf: nrf}}
spec:
  replicas: 1
  selector: {matchLabels: {app: nrf}}
  template:
    metadata: {labels: {app: nrf, nf: nrf}}
    spec:
      containers:
      - name: nrf
        image: public.ecr.aws/a7y4t3f5/telco-buddy/open5gs:2.6.6
        command: ["/opt/open5gs/bin/open5gs-nrfd"]
        ports: [{containerPort: 7777, protocol: TCP}]
---
apiVersion: v1
kind: Service
metadata: {name: nrf, namespace: open5gs}
spec: {selector: {app: nrf}, ports: [{port: 7777, targetPort: 7777, protocol: TCP}]}
