---
# ─── AMF-1 (TAC=1, serves gNB-1a and gNB-1b) ───
apiVersion: v1
kind: ConfigMap
metadata: {name: amf1-config, namespace: open5gs}
data:
  amf.yaml: |
    amf:
      sbi:
        - addr: 0.0.0.0
          port: 7777
      ngap:
        - addr: 0.0.0.0
      guami:
        - plmn_id: {mcc: 999, mnc: 70}
          amf_id: {region: 2, set: 1}
      tai:
        - plmn_id: {mcc: 999, mnc: 70}
          tac: 1
      plmn_support:
        - plmn_id: {mcc: 999, mnc: 70}
          s_nssai:
            - sst: 1
      security:
        integrity_order: [NIA2, NIA1, NIA0]
        ciphering_order: [NEA0, NEA1, NEA2]
      network_name:
        full: Open5GS
      amf_name: open5gs-amf1
    scp:
      sbi:
        - addr: scp.open5gs.svc.cluster.local
          port: 7777
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: amf1, namespace: open5gs, labels: {nf: amf}}
spec:
  replicas: 1
  selector: {matchLabels: {app: amf1}}
  template:
    metadata: {labels: {app: amf1, nf: amf}}
    spec:
      containers:
      - name: amf
        image: public.ecr.aws/a7y4t3f5/telco-buddy/open5gs:2.6.6
        command: ["/opt/open5gs/bin/open5gs-amfd", "-c", "/config/amf.yaml"]
        ports: [{containerPort: 38412, protocol: SCTP}, {containerPort: 9090}]
        volumeMounts: [{name: cfg, mountPath: /config}]
      volumes: [{name: cfg, configMap: {name: amf1-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: amf1, namespace: open5gs}
spec:
  selector: {app: amf1}
  ports:
  - {name: ngap, port: 38412, protocol: SCTP}
  - {name: metrics, port: 9090}
---
