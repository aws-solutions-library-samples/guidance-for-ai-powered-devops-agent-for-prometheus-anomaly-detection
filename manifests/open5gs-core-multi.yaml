---
# ─── SMF (single, routes to 4 UPFs by DNN) ───
apiVersion: v1
kind: ConfigMap
metadata: {name: smf-config, namespace: open5gs}
data:
  smf.yaml: |
    smf:
      sbi:
        - addr: 0.0.0.0
          port: 7777
      pfcp:
        - addr: 0.0.0.0
      gtpu:
        - addr: 0.0.0.0
      subnet:
        - addr: 10.45.0.1/16
          dnn: internet
        - addr: 10.46.0.1/16
          dnn: internet2
        - addr: 10.47.0.1/16
          dnn: iot
        - addr: 10.48.0.1/16
          dnn: edge
      dns:
        - 8.8.8.8
        - 8.8.4.4
      mtu: 1400
      freeDiameter: /opt/open5gs/etc/freeDiameter/smf.conf
    scp:
      sbi:
        - addr: scp.open5gs.svc.cluster.local
          port: 7777
    upf:
      pfcp:
        - addr: upf1.open5gs.svc.cluster.local
          dnn: [internet]
        - addr: upf2.open5gs.svc.cluster.local
          dnn: [internet2]
        - addr: upf3.open5gs.svc.cluster.local
          dnn: [iot]
        - addr: upf4.open5gs.svc.cluster.local
          dnn: [edge]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: smf, namespace: open5gs, labels: {nf: smf}}
spec:
  replicas: 1
  selector: {matchLabels: {app: smf}}
  template:
    metadata: {labels: {app: smf, nf: smf}}
    spec:
      containers:
      - name: smf
        image: public.ecr.aws/a7y4t3f5/telco-buddy/open5gs:2.6.6
        command: ["/opt/open5gs/bin/open5gs-smfd", "-c", "/config/smf.yaml"]
        ports: [{containerPort: 8805, protocol: UDP}, {containerPort: 9090}]
        volumeMounts: [{name: cfg, mountPath: /config}]
      volumes: [{name: cfg, configMap: {name: smf-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: smf, namespace: open5gs}
spec:
  selector: {app: smf}
  ports:
  - {name: pfcp, port: 8805, protocol: UDP}
  - {name: metrics, port: 9090}
---
# ─── UPF-1 (DNN: internet, subnet 10.45.0.0/16) ───
apiVersion: v1
kind: ConfigMap
metadata: {name: upf1-config, namespace: open5gs}
data:
  upf.yaml: |
    upf:
      pfcp:
        - addr: 0.0.0.0
      gtpu:
        - addr: 0.0.0.0
      subnet:
        - addr: 10.45.0.1/16
          dnn: internet
          dev: ogstun
    smf:
      pfcp:
        - addr: smf.open5gs.svc.cluster.local
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: upf1, namespace: open5gs, labels: {nf: upf}}
spec:
  replicas: 1
  selector: {matchLabels: {app: upf1}}
  template:
    metadata: {labels: {app: upf1, nf: upf}}
    spec:
      containers:
      - name: upf
        image: public.ecr.aws/a7y4t3f5/telco-buddy/open5gs:2.6.6
        command: ["/opt/open5gs/bin/open5gs-upfd", "-c", "/config/upf.yaml"]
        ports: [{containerPort: 8805, protocol: UDP}, {containerPort: 2152, protocol: UDP}, {containerPort: 9090}]
        securityContext: {capabilities: {add: [NET_ADMIN]}, privileged: true}
        volumeMounts: [{name: cfg, mountPath: /config}]
      volumes: [{name: cfg, configMap: {name: upf1-config}}]
---
apiVersion: v1
