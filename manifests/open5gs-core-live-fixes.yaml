# Live working core fixes (exported 2026-06-24T12:17Z).
# Apply AFTER open5gs-core-multi.yaml to overlay the verified config fixes:
#  - dev:eth0 SBI/PFCP/GTPU binds (NF discoverability)
#  - NSSF nsi -> real NRF, SMF info/subnet, direct-NRF on AMF/SMF
#  - UPF postStart ogstun setup is on the Deployments (see kubectl get deploy upfN -o yaml)
# Headless services (smf, upf1-4) are in open5gs-core-multi.yaml.
---
apiVersion: v1
data:
  amf.yaml: |2

    sbi:
      server:
        no_tls: true
      client:
        no_tls: true
    time:
      t3512:
        value: 540
    amf:
      sbi:
        - dev: eth0
          port: 7777
      ngap:
        - addr: 0.0.0.0
      metrics:
        - addr: 0.0.0.0
          port: 9090
      guami:
        - plmn_id: {mcc: 999, mnc: 70}
          amf_id: {region: 2, set: 1}
      tai:
        - plmn_id: {mcc: 999, mnc: 70}
          tac: 1
      plmn_support:
        - plmn_id: {mcc: 999, mnc: 70}
          s_nssai:
            - sst: 1
      security:
        integrity_order: [NIA2, NIA1, NIA0]
        ciphering_order: [NEA0, NEA1, NEA2]
      network_name:
        full: Open5GS
      amf_name: open5gs-amf1
    nrf:
      sbi:
        - addr: nrf.open5gs.svc.cluster.local
          port: 7777
kind: ConfigMap
metadata:
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: |
