apiVersion: v1
data:
  smf.yaml: |2

    sbi:
      server:
        no_tls: true
      client:
        no_tls: true
    smf:
      sbi:
        - dev: eth0
          port: 7777
      pfcp:
        - dev: eth0
      gtpc:
        - dev: eth0
      gtpu:
        - dev: eth0
      metrics:
        - addr: 0.0.0.0
          port: 9090
      info:
        - s_nssai:
            - sst: 1
              dnn: [internet, internet2, iot, edge]
      subnet:
        - addr: 10.45.0.1/16
          dnn: internet
        - addr: 10.46.0.1/16
          dnn: internet2
        - addr: 10.47.0.1/16
          dnn: iot
        - addr: 10.48.0.1/16
          dnn: edge
      dns: [8.8.8.8, 8.8.4.4]
      mtu: 1400
    nrf:
      sbi:
        - addr: nrf.open5gs.svc.cluster.local
          port: 7777
    upf:
      pfcp:
        - addr: upf1.open5gs.svc.cluster.local
          dnn: [internet]
        - addr: upf2.open5gs.svc.cluster.local
          dnn: [internet2]
        - addr: upf3.open5gs.svc.cluster.local
          dnn: [iot]
        - addr: upf4.open5gs.svc.cluster.local
          dnn: [edge]
