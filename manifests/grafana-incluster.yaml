---
# In-cluster Grafana for the open5gs 5G RCF demo.
# SECURITY: ClusterIP only (NO public LoadBalancer on :3000, per aws-security-guardrails).
# Access:  kubectl -n monitoring port-forward svc/grafana 3000:3000  ->  http://localhost:3000
# Queries Amazon Managed Prometheus via SigV4 using IRSA (SA: monitoring/grafana-amp).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-amp
  namespace: monitoring
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::985090322243:role/open5gs-grafana-amp-query
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: open5gs-demo-2026
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: AMP
        uid: amp
        type: prometheus
        access: proxy
        url: https://aps-workspaces.us-east-1.amazonaws.com/workspaces/ws-185ff7f8-c698-4d0e-9135-945b03aeccd1
        isDefault: true
        jsonData:
          httpMethod: POST
          sigV4Auth: true
          sigV4AuthType: default
          sigV4Region: us-east-1
          timeInterval: 30s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: '5g-dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-5g
  namespace: monitoring
data:
  5g-demo.json: |
    {
      "uid": "open5gs-5g-rcf",
      "title": "open5gs 5G \u2014 RCF Anomaly Detection (1000 UEs)",
      "tags": [
        "5g",
        "open5gs",
        "rcf",
        "amp"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "type": "stat",
          "title": "Registered Subscribers (total)",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "datasource": {
            "type": "prometheus",
            "uid": "amp"
          },
          "targets": [
            {
              "expr": "sum(fivegs_amffunction_rm_registeredsubnbr)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 800
                  },
                  {
                    "color": "green",
                    "value": 950
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "PDU Sessions (total)",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "amp"
          },
          "targets": [
            {
              "expr": "sum(fivegs_smffunction_sm_sessionnbr)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 800
                  },
                  {
                    "color": "green",
                    "value": 950
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "Active UEs (SMF)",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "amp"
          },
          "targets": [
            {
              "expr": "sum(ues_active)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "RCF Anomaly Score",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "amp"
          },
          "targets": [
            {
              "expr": "max(anomaly_detector:score{alias=\"5g-registered-subscribers\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Registration over time (total + per AMF)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "amp"
          },
          "targets": [
            {
              "expr": "sum(fivegs_amffunction_rm_registeredsubnbr)",
              "legendFormat": "total",
              "refId": "A"
            },
            {
              "expr": "fivegs_amffunction_rm_registeredsubnbr",
              "legendFormat": "{{pod}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "RCF: value vs learned band  (score on right axis)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "amp"
          },
          "targets": [
            {
              "expr": "anomaly_detector:value{alias=\"5g-registered-subscribers\"}",
              "legendFormat": "value",
              "refId": "A"
            },
            {
              "expr": "anomaly_detector:upper_band{alias=\"5g-registered-subscribers\"}",
              "legendFormat": "upper_band",
              "refId": "B"
            },
            {
              "expr": "anomaly_detector:lower_band{alias=\"5g-registered-subscribers\"}",
              "legendFormat": "lower_band",
              "refId": "C"
            },
            {
              "expr": "anomaly_detector:score{alias=\"5g-registered-subscribers\"}",
              "legendFormat": "score",
              "refId": "D"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "PDU sessions per UPF",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "amp"
          },
          "targets": [
            {
              "expr": "fivegs_upffunction_upf_sessionnbr",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "User-plane throughput per UPF (RX+TX)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "id": 8,
          "datasource": {
            "type": "prometheus",
            "uid": "amp"
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=\"open5gs\", pod=~\"upf.*\"}[2m]) + rate(container_network_transmit_bytes_total{namespace=\"open5gs\", pod=~\"upf.*\"}[2m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "AMF pod restarts (fault signal)",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 20
          },
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "amp"
          },
          "targets": [
            {
              "expr": "max by (pod) (kube_pod_container_status_restarts_total{namespace=\"open5gs\", pod=~\"amf.*\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels: {app: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      serviceAccountName: grafana-amp
      securityContext: {fsGroup: 472, runAsUser: 472}
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - {containerPort: 3000, name: http}
          env:
            - {name: GF_SECURITY_ADMIN_USER, valueFrom: {secretKeyRef: {name: grafana-admin, key: admin-user}}}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: grafana-admin, key: admin-password}}}
            - {name: GF_AUTH_SIGV4_AUTH_ENABLED, value: "true"}
            - {name: AWS_REGION, value: us-east-1}
            - {name: AWS_STS_REGIONAL_ENDPOINTS, value: regional}
            - {name: GF_INSTALL_PLUGINS, value: ""}
            - {name: GF_USERS_DEFAULT_THEME, value: dark}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - {name: datasources, configMap: {name: grafana-datasources}}
        - {name: dashboard-provider, configMap: {name: grafana-dashboard-provider}}
        - {name: dashboards, configMap: {name: grafana-dashboard-5g}}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels: {app: grafana}
spec:
  type: ClusterIP
  selector: {app: grafana}
  ports:
    - {port: 3000, targetPort: 3000, name: http}
