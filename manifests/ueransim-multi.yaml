---
# UERANSIM Multi-gNB deployment: 100 gNBs × 10 UEs = 1000 UEs (1:10)
# Each gNB pod runs nr-gnb + nr-ue (-n 10) + traffic-gen (pings DNN gateway).
# IMSI format: 99970000000%04d  (supports 0001-1000)
#   gNB-1a (TAC=1, AMF1, DNN=internet,  IMSI 0001-0250, GW 10.45.0.1)
#   gNB-1b (TAC=1, AMF1, DNN=internet2, IMSI 0251-0500, GW 10.46.0.1)
#   gNB-2a (TAC=2, AMF2, DNN=iot,       IMSI 0501-0750, GW 10.47.0.1)
#   gNB-2b (TAC=2, AMF2, DNN=edge,      IMSI 0751-1000, GW 10.48.0.1)
# Per-pod base IMSI = IMSI_START + ordinal*10 ; nr-ue -n 10 increments supi.
apiVersion: v1
kind: ConfigMap
metadata: {name: ueransim-gnb1a-config, namespace: open5gs}
data:
  gnb.yaml: |
    mcc: '999'
    mnc: '70'
    nci: '0x000000010'
    idLength: 32
    tac: 1
    linkIp: 127.0.0.1
    ngapIp: POD_IP
    gtpIp: POD_IP
    amfConfigs:
      - address: amf1.open5gs.svc.cluster.local
        port: 38412
    slices:
      - sst: 1
    ignoreStreamIds: true
---
apiVersion: v1
kind: ConfigMap
metadata: {name: ueransim-gnb1b-config, namespace: open5gs}
data:
  gnb.yaml: |
    mcc: '999'
