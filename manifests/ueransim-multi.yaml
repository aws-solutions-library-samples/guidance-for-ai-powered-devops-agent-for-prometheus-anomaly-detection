---
# UERANSIM Multi-gNB deployment: 4 gNBs × 25 UEs = 100 UEs
# gNB-1a (TAC=1, AMF1, DNN=internet, IMSI 001-025)
# gNB-1b (TAC=1, AMF1, DNN=internet2, IMSI 026-050)
# gNB-2a (TAC=2, AMF2, DNN=iot, IMSI 051-075)
# gNB-2b (TAC=2, AMF2, DNN=edge, IMSI 076-100)
apiVersion: v1
kind: ConfigMap
metadata: {name: ueransim-gnb1a-config, namespace: open5gs}
data:
  gnb.yaml: |
    mcc: '999'
    mnc: '70'
    nci: '0x000000010'
    idLength: 32
    tac: 1
    linkIp: 127.0.0.1
    ngapIp: POD_IP
    gtpIp: POD_IP
    amfConfigs:
      - address: amf1.open5gs.svc.cluster.local
        port: 38412
    slices:
      - sst: 1
    ignoreStreamIds: true
  dnn: internet
  imsi_start: "1"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: ueransim-gnb1b-config, namespace: open5gs}
data:
  gnb.yaml: |
    mcc: '999'
