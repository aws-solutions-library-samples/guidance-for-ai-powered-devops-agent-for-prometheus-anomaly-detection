apiVersion: v1
kind: ConfigMap
metadata: { name: ueransim-config, namespace: open5gs }
data:
  gnb.yaml: |
    mcc: '999'
    mnc: '70'
    nci: '0x000000010'
    idLength: 32
    tac: 1
    linkIp: 127.0.0.1
    ngapIp: POD_IP
    gtpIp: POD_IP
    amfConfigs:
      - address: 10.100.254.3
        port: 38412
    slices:
      - sst: 1
    ignoreStreamIds: true
  ue.yaml: |
    supi: 'imsi-999700000000001'
    mcc: '999'
    mnc: '70'
    protectionScheme: 0
    homeNetworkPublicKeyId: 0
    routingIndicator: '0000'
    key: '465B5CE8B199B49FAA5F0A2EE238A6BC'
    op: 'E8ED289DEBA952E4283B54E88E6183CA'
    opType: 'OPC'
    amf: '8000'
    imei: '356938035643803'
    imeiSv: '4370816125816151'
    gnbSearchList:
      - 127.0.0.1
    uacAic: { mps: false, mcs: false }
    uacAcc: { normalClass: 0, class11: false, class12: false, class13: false, class14: false, class15: false }
    sessions:
      - type: 'IPv4'
        apn: 'internet'
        slice: { sst: 1 }
    configured-nssai:
      - sst: 1
    default-nssai:
      - sst: 1
        sd: 1
    integrity: { IA1: true, IA2: true, IA3: true }
    ciphering: { EA1: true, EA2: true, EA3: true }
    integrityMaxRate: { uplink: 'full', downlink: 'full' }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ueransim, namespace: open5gs, labels: { app: ueransim } }
spec:
  replicas: 1
  selector: { matchLabels: { app: ueransim } }
  template:
    metadata: { labels: { app: ueransim } }
    spec:
      containers:
      - name: gnb
        image: gradiant/ueransim:3.2.6
        env:
        - name: POD_IP
          valueFrom: { fieldRef: { fieldPath: status.podIP } }
        command: ["/bin/sh","-c"]
        args: ["sed \"s/POD_IP/$POD_IP/g\" /config/gnb.yaml > /tmp/gnb.yaml && exec nr-gnb -c /tmp/gnb.yaml"]
        volumeMounts: [{ name: cfg, mountPath: /config }]
      - name: ue
        image: gradiant/ueransim:3.2.6
        securityContext: { capabilities: { add: [NET_ADMIN] }, privileged: true }
        command: ["/bin/sh","-c"]
        args: ["sleep 20 && exec nr-ue -c /config/ue.yaml"]
        volumeMounts: [{ name: cfg, mountPath: /config }]
      volumes: [{ name: cfg, configMap: { name: ueransim-config } }]
